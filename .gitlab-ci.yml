# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
image: node:latest
stages:
- test
- release
- publish
before_script:
- npm install -g yarn
- yarn install --frozen-lockfile

test:
  stage: test
  script:
  - yarn test

lint:
  stage: test
  script:
    - yarn lint

publish:npm:
  stage: publish
  image: node:24
  rules:
    - if: '$CI_COMMIT_TAG'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  before_script: []
  script:
    - npm stage publish

cache:
  paths:
  - node_modules/
  - ".yarn"
include:
- component: $CI_SERVER_FQDN/niclas-zone/ci/trivy/target_filesystem@2.5.2
  inputs:
    TRIVY_FS_PATH: "."
    TRIVY_SCANNERS: "vuln"
- template: Jobs/SAST.gitlab-ci.yml
- template: Jobs/Secret-Detection.gitlab-ci.yml
- component: $CI_SERVER_FQDN/apricote/releaser-pleaser/run@v0.9.0
  inputs:
    token: $RELEASER_PLEASER_TOKEN
    stage: release
    updaters: "packagejson"
    needs:
    - test
    - lint

# These jobs inherit the top-level before_script by default, but their
# analyzer images have no npm/yarn. semgrep-sast, secret_detection and
# releaser-pleaser have no before_script of their own, so an empty override
# is safe. publish:npm uses node:24, which ships yarn preinstalled, so
# `npm install -g yarn` fails with EEXIST. The Trivy component's
# before_script creates artifacts/trivy/ and placeholder report files
# required by its script - that must be preserved, just without the
# npm/yarn install steps.
trivy:scan:filesystem:
  before_script:
  - set -eu
  - mkdir -p artifacts/trivy
  - touch gl-container-scanning-report.json artifacts/trivy/junit-placeholder.xml

semgrep-sast:
  before_script: []

secret_detection:
  before_script: []

releaser-pleaser:
  before_script: []
